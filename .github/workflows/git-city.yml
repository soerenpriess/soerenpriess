name: Git City

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/git-city.yml]

permissions:
  contents: write

concurrency: git-city

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: soerenpriess/GitCity@main
        with:
          output: assets/city.gif